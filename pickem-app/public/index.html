<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick'em Challenge</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
<link rel="manifest" href="/icons/site.webmanifest">
<link rel="shortcut icon" href="/icons/favicon.ico">
</head>
<body>
  <div class="scorebar">
    <a class="brand" href="/index.html">PICK<span>'</span>EM</a>
    <nav>
      <a href="#" id="tabPicks" class="active">Picks</a>
      <a href="#" id="tabBoard">Leaderboard</a>
      <a href="/account.html">Account</a>
      <a href="/admin.html" id="tabAdmin" style="display:none">Admin</a>
    </nav>
    <div class="who">
      <span id="whoami"></span>
      <button id="logoutBtn">Sign out</button>
    </div>
  </div>

  <div class="wrap">

    <!-- PICKS VIEW -->
    <div id="picksView">
      <div class="tabbar">
        <button class="league-tab active" data-league="NFL">NFL</button>
        <button class="league-tab" data-league="NCAAF">NCAAF</button>
        <div class="week-nav">
          <button id="weekDown">‹</button>
          <span id="weekLabel">Week 1</span>
          <button id="weekUp">›</button>
        </div>
      </div>
      <div id="picksMsg"></div>
      <div id="propsList"></div>
      <div id="gamesList"></div>
    </div>

    <!-- LEADERBOARD VIEW -->
    <div id="boardView" style="display:none">
      <div class="tabbar">
        <button class="league-tab active" data-scope="overall">Overall</button>
        <button class="league-tab" data-scope="NFL">NFL</button>
        <button class="league-tab" data-scope="NCAAF">NCAAF</button>
      </div>
      <div id="boardList" style="margin-top:20px"></div>
    </div>

  </div>

  <!-- iOS "Add to Home Screen" install banner. Hidden by default; shown via
       JS only for iPhone/iPad Safari visitors who haven't installed the app
       and haven't dismissed the banner recently (see installPrompt.js). -->
  <div id="ios-install-banner" class="ios-install-banner" style="display:none">
    <button id="iosInstallClose" class="ios-install-close" aria-label="Dismiss">&times;</button>
    <p class="ios-install-text">
      Install Pick'em on your iPhone: tap the <strong>Share</strong> icon
      <span class="ios-share-icon" aria-hidden="true">&#8593;</span>
      below, then choose <strong>Add to Home Screen</strong>.
    </p>
    <div class="ios-install-arrow"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/installPrompt.js"></script>
  <script>
    let league = 'NFL';
    let week = estimateCurrentWeek();
    let year = currentSeasonYear();
    let boardScope = 'overall';

    const gamesList = document.getElementById('gamesList');
    const weekLabel = document.getElementById('weekLabel');
    const picksMsg = document.getElementById('picksMsg');

    async function init() {
      const user = await requireLogin();
      if (!user) return;
      document.getElementById('whoami').textContent = user.username;
      if (user.is_admin) document.getElementById('tabAdmin').style.display = '';
      loadGames();
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await api.post('/api/auth/logout');
      window.location.href = '/login.html';
    });

    // Tab switching
    document.getElementById('tabPicks').addEventListener('click', (e) => {
      e.preventDefault();
      show('picks');
    });
    document.getElementById('tabBoard').addEventListener('click', (e) => {
      e.preventDefault();
      show('board');
      loadBoard();
    });
    function show(which) {
      document.getElementById('picksView').style.display = which === 'picks' ? '' : 'none';
      document.getElementById('boardView').style.display = which === 'board' ? '' : 'none';
      document.getElementById('tabPicks').classList.toggle('active', which === 'picks');
      document.getElementById('tabBoard').classList.toggle('active', which === 'board');
    }

    // League tabs (picks view)
    document.querySelectorAll('#picksView .league-tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#picksView .league-tab').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        league = btn.dataset.league;
        loadGames();
      });
    });

    document.getElementById('weekUp').addEventListener('click', () => { week++; loadGames(); });
    document.getElementById('weekDown').addEventListener('click', () => { if (week > 1) { week--; loadGames(); } });

    async function loadGames() {
      weekLabel.textContent = `Week ${week}`;
      gamesList.innerHTML = '<div class="empty">Loading…</div>';
      picksMsg.innerHTML = '';
      loadProps();
      try {
        const { games } = await api.get(`/api/games?league=${league}&week=${week}&year=${year}`);
        if (games.length === 0) {
          gamesList.innerHTML = `<div class="empty">No games selected yet for ${league} Week ${week}.<br>Check back once the admin sets the slate.</div>`;
          return;
        }
        gamesList.innerHTML = '';
        games.forEach((g) => gamesList.appendChild(renderGame(g)));
      } catch (err) {
        gamesList.innerHTML = `<div class="error-msg">${err.message}</div>`;
      }
    }

    const propsList = document.getElementById('propsList');

    async function loadProps() {
      propsList.innerHTML = '';
      try {
        const { props } = await api.get(`/api/props?league=${league}&week=${week}&year=${year}`);
        props.forEach((p) => propsList.appendChild(renderProp(p)));
      } catch (err) {
        // Non-fatal — just skip the props section if something goes wrong.
      }
    }

    function renderProp(p) {
      const div = document.createElement('div');
      div.className = 'prop';
      if (p.my_answer_correct === 1) div.classList.add('graded-correct');
      if (p.my_answer_correct === 0) div.classList.add('graded-incorrect');

      const statusText = p.status === 'closed'
        ? `<span class="status-final">GRADED — ${p.correct_answer.toUpperCase()}</span>`
        : (p.locked ? '🔒 Locked' : 'Prop pick — Yes/No');

      div.innerHTML = `
        <div class="prop-status">${statusText}</div>
        <div class="prop-question">${p.question}</div>
        <div class="prop-choices">
          <button class="prop-btn yes-btn ${p.my_answer === 'yes' ? 'picked' : ''}" ${p.locked ? 'disabled' : ''}>YES</button>
          <button class="prop-btn no-btn ${p.my_answer === 'no' ? 'picked' : ''}" ${p.locked ? 'disabled' : ''}>NO</button>
        </div>
      `;

      const yesBtn = div.querySelector('.yes-btn');
      const noBtn = div.querySelector('.no-btn');
      if (!p.locked) {
        yesBtn.addEventListener('click', () => makePropPick(p.id, 'yes', div));
        noBtn.addEventListener('click', () => makePropPick(p.id, 'no', div));
      }
      return div;
    }

    async function makePropPick(propId, answer, rowEl) {
      const yesBtn = rowEl.querySelector('.yes-btn');
      const noBtn = rowEl.querySelector('.no-btn');
      const prevYes = yesBtn.classList.contains('picked');
      const prevNo = noBtn.classList.contains('picked');

      yesBtn.classList.toggle('picked', answer === 'yes');
      noBtn.classList.toggle('picked', answer === 'no');
      picksMsg.innerHTML = '';

      try {
        await api.post('/api/props/pick', { prop_id: propId, answer });
      } catch (err) {
        yesBtn.classList.toggle('picked', prevYes);
        noBtn.classList.toggle('picked', prevNo);
        picksMsg.innerHTML = `<div class="error-msg">${err.message}</div>`;
      }
    }

    function renderGame(g) {
      const div = document.createElement('div');
      div.className = 'game';
      if (g.my_pick_correct === 1) div.classList.add('graded-correct');
      if (g.my_pick_correct === 0) div.classList.add('graded-incorrect');

      const kickoff = new Date(g.start_time);
      const timeStr = kickoff.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

      const statusText = g.status === 'final'
        ? `<span class="status-final">FINAL</span>`
        : (g.locked ? `<span class="lock">🔒 Locked</span>` : `<span class="lock">Picks open</span>`);

      div.innerHTML = `
        <div class="game-meta">
          <span>${timeStr}${g.odds_summary ? ` &middot; ${g.odds_summary}` : ''}</span>
          <span>${statusText}</span>
        </div>
        <div class="matchup">
          <button class="team-btn away-btn ${g.my_pick === 'away' ? 'picked' : ''}" ${g.locked ? 'disabled' : ''}>
            ${g.away_team_logo ? `<img src="${g.away_team_logo}" alt="">` : ''}
            <span class="abbr">${g.away_rank ? `<span class="rank-badge">#${g.away_rank}</span> ` : ''}${g.away_team_abbr || g.away_team}</span>
            ${g.away_score !== null ? `<span class="score">${g.away_score}</span>` : ''}
          </button>
          <span class="at-sign">@</span>
          <button class="team-btn right-side home-btn ${g.my_pick === 'home' ? 'picked' : ''}" ${g.locked ? 'disabled' : ''}>
            ${g.home_team_logo ? `<img src="${g.home_team_logo}" alt="">` : ''}
            <span class="abbr">${g.home_rank ? `<span class="rank-badge">#${g.home_rank}</span> ` : ''}${g.home_team_abbr || g.home_team}</span>
            ${g.home_score !== null ? `<span class="score">${g.home_score}</span>` : ''}
          </button>
        </div>
      `;

      div.dataset.gameId = g.id;

      // Everyone's picks are visible on any game at any time — not just
      // after it locks. The pick buttons themselves stay disabled once
      // locked (handled below), but the reveal panel is always available.
      const revealWrap = document.createElement('div');
      revealWrap.className = 'picks-reveal-wrap';
      revealWrap.innerHTML = `
        <button class="reveal-btn">Show picks ▾</button>
        <div class="picks-reveal" style="display:none"></div>
      `;
      div.appendChild(revealWrap);

      const revealBtn = revealWrap.querySelector('.reveal-btn');
      const revealPanel = revealWrap.querySelector('.picks-reveal');
      let loaded = false;

      revealBtn.addEventListener('click', async () => {
        const isOpen = revealPanel.style.display !== 'none';
        if (isOpen) {
          revealPanel.style.display = 'none';
          revealBtn.textContent = 'Show picks ▾';
          return;
        }
        revealBtn.textContent = 'Hide picks ▴';
        revealPanel.style.display = '';
        if (loaded) return;
        revealPanel.innerHTML = '<div class="empty" style="padding:10px">Loading…</div>';
        try {
          const { picks } = await api.get(`/api/games/${g.id}/picks`);
          loaded = true;
          if (picks.length === 0) {
            revealPanel.innerHTML = '<div class="empty" style="padding:10px">No one has picked this game yet.</div>';
            return;
          }
          revealPanel.innerHTML = '';
          picks.forEach((p) => {
            const row = document.createElement('div');
            row.className = 'pick-row';
            if (p.is_correct === 1) row.classList.add('pick-correct');
            if (p.is_correct === 0) row.classList.add('pick-incorrect');
            const teamLabel = p.pick === 'home' ? (g.home_team_abbr || g.home_team) : (g.away_team_abbr || g.away_team);
            row.innerHTML = `<span>${p.username}</span><span class="pick-row-team">${teamLabel}</span>`;
            revealPanel.appendChild(row);
          });
        } catch (err) {
          revealPanel.innerHTML = `<div class="error-msg">${err.message}</div>`;
        }
      });

      const awayBtn = div.querySelector('.away-btn');
      const homeBtn = div.querySelector('.home-btn');
      if (!g.locked) {
        awayBtn.addEventListener('click', () => makePick(g.id, 'away', div));
        homeBtn.addEventListener('click', () => makePick(g.id, 'home', div));
      }
      return div;
    }

    // Optimistically updates just the one game row instead of reloading the
    // whole list, so picking doesn't cause a visible full-screen refresh.
    async function makePick(gameId, pick, rowEl) {
      const awayBtn = rowEl.querySelector('.away-btn');
      const homeBtn = rowEl.querySelector('.home-btn');
      const prevAway = awayBtn.classList.contains('picked');
      const prevHome = homeBtn.classList.contains('picked');

      awayBtn.classList.toggle('picked', pick === 'away');
      homeBtn.classList.toggle('picked', pick === 'home');
      picksMsg.innerHTML = '';

      try {
        await api.post('/api/picks', { game_id: gameId, pick });
      } catch (err) {
        // revert the optimistic change on failure
        awayBtn.classList.toggle('picked', prevAway);
        homeBtn.classList.toggle('picked', prevHome);
        picksMsg.innerHTML = `<div class="error-msg">${err.message}</div>`;
      }
    }

    // Leaderboard
    document.querySelectorAll('#boardView .league-tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#boardView .league-tab').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        boardScope = btn.dataset.scope;
        loadBoard();
      });
    });

    async function loadBoard() {
      const boardList = document.getElementById('boardList');
      boardList.innerHTML = '<div class="empty">Loading…</div>';
      const qs = boardScope === 'overall' ? '' : `?league=${boardScope}`;
      try {
        const { leaderboard } = await api.get(`/api/leaderboard${qs}`);
        if (leaderboard.length === 0) {
          boardList.innerHTML = '<div class="empty">No players yet.</div>';
          return;
        }
        boardList.innerHTML = '';
        leaderboard.forEach((row, i) => {
          const div = document.createElement('div');
          div.className = 'board-row';
          div.innerHTML = `
            <div class="rank">${i + 1}</div>
            <div>
              <div class="name">${row.username}</div>
              <div class="sub">${row.graded_picks} graded picks</div>
            </div>
            <div class="pts">${row.correct_picks}<small>correct</small></div>
          `;
          boardList.appendChild(div);
        });
      } catch (err) {
        boardList.innerHTML = `<div class="error-msg">${err.message}</div>`;
      }
    }

    init();
  </script>
</body>
</html>
