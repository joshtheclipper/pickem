<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account — Pick'em Challenge</title>
<!-- Paints the dark background immediately, before style.css (which chains
     to a remote Google Fonts @import) finishes loading — otherwise every
     navigation between pages flashes white while that chain resolves.
     Purely cosmetic — no JS, no interaction with the tab-switching logic. -->
<style>html{background:#12261c}</style>
<link rel="stylesheet" href="/css/style.css">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
<link rel="manifest" href="/icons/site.webmanifest">
<link rel="shortcut icon" href="/icons/favicon.ico">
</head>
<body>
  <div class="scorebar">
    <a class="brand" href="/index.html">PICK<span>'</span>EM</a>
    <nav>
      <a href="/index.html">Picks</a>
      <a href="/index.html?tab=board" id="goBoard">Leaderboard</a>
      <a href="/account.html" class="active">Account</a>
      <a href="/admin.html" id="tabAdmin" style="display:none">Admin</a>
    </nav>
    <div class="who">
      <span id="whoami"></span>
      <button id="logoutBtn">Sign out</button>
    </div>
  </div>

  <div class="wrap">
    <h2 style="margin:26px 0 4px">Account settings</h2>
    <div style="color:var(--chalk-dim);font-size:0.85rem;margin-bottom:20px">
      Change your username and/or PIN. Your current PIN is required to confirm any change.
    </div>

    <div id="msg"></div>

    <form id="form" style="max-width:340px">
      <div class="field">
        <label for="newUsername">Username</label>
        <input id="newUsername" maxlength="30">
      </div>
      <div class="field">
        <label for="newPin">New PIN <span style="text-transform:none">(leave blank to keep current)</span></label>
        <input id="newPin" type="password" inputmode="numeric" minlength="4" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="currentPin">Current PIN <span style="text-transform:none">(required to save)</span></label>
        <input id="currentPin" type="password" inputmode="numeric" required autocomplete="current-password">
      </div>
      <button class="btn" type="submit" id="submitBtn">Save changes</button>
    </form>

    <div id="notifySection" style="max-width:340px;margin-top:38px;display:none">
      <h3 style="margin:0 0 4px">Notifications</h3>
      <div style="color:var(--chalk-dim);font-size:0.85rem;margin-bottom:14px">
        Get a push notification on this device when the admin posts a new slate
        (games or props) for a week.
      </div>
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
        <input type="checkbox" id="notifyToggle" style="width:18px;height:18px;accent-color:var(--gold)">
        <span>Notify me when a new slate is posted</span>
      </label>
      <div id="notifyMsg" style="font-size:0.8rem;color:var(--chalk-dim);margin-top:10px"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/push.js"></script>
  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');

    async function init() {
      const user = await requireLogin();
      if (!user) return;
      document.getElementById('whoami').textContent = user.username;
      document.getElementById('newUsername').value = user.username;
      if (user.is_admin) document.getElementById('tabAdmin').style.display = '';
      initNotifications();
    }

    // --- "Notify me when a new slate is posted" toggle ---
    // The checkbox tracks whether *this device* is set up for push. Turning
    // it on runs the permission prompt + subscription and flips the account
    // flag; turning it off unsubscribes this device and clears the flag.
    async function initNotifications() {
      const section = document.getElementById('notifySection');
      const toggle = document.getElementById('notifyToggle');
      const msg = document.getElementById('notifyMsg');

      let config;
      try {
        config = await api.get('/api/push/config');
      } catch (e) {
        return; // leave the section hidden
      }
      if (!config.enabled) return; // push not configured on the server

      section.style.display = '';

      if (!pushClient.supported()) {
        toggle.disabled = true;
        msg.textContent =
          'This browser can’t show notifications. On iPhone, add this app to your Home Screen first, then try again.';
        return;
      }

      const sub = await pushClient.currentSubscription();
      toggle.checked = !!(config.notify_slate && sub);
      if (config.notify_slate && !sub) {
        msg.textContent = 'On for another device. Turn it on here to also get them on this one.';
      }

      toggle.addEventListener('change', async () => {
        toggle.disabled = true;
        msg.textContent = '';
        try {
          if (toggle.checked) {
            const r = await pushClient.enable(config.public_key);
            if (r.ok) {
              msg.textContent = 'Done — you’ll get a notification when the next slate is posted.';
            } else {
              toggle.checked = false;
              msg.textContent =
                r.reason === 'denied'
                  ? 'Notifications are blocked for this site in your browser settings.'
                  : r.reason === 'unsupported'
                  ? 'This browser can’t show notifications.'
                  : 'Couldn’t turn notifications on. Try again.';
            }
          } else {
            await pushClient.disable();
            msg.textContent = 'Notifications turned off.';
          }
        } catch (e) {
          toggle.checked = !toggle.checked;
          msg.textContent = 'Something went wrong. Try again.';
        } finally {
          toggle.disabled = false;
        }
      });
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await api.post('/api/auth/logout');
      window.location.href = '/login.html';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.innerHTML = '';
      const new_username = document.getElementById('newUsername').value.trim();
      const new_pin = document.getElementById('newPin').value;
      const current_pin = document.getElementById('currentPin').value;

      submitBtn.disabled = true;
      try {
        const { user } = await api.post('/api/auth/update', { current_pin, new_username, new_pin: new_pin || undefined });
        msg.innerHTML = '<div class="ok-msg">Saved. Your account has been updated.</div>';
        document.getElementById('whoami').textContent = user.username;
        document.getElementById('currentPin').value = '';
        document.getElementById('newPin').value = '';
      } catch (err) {
        msg.innerHTML = `<div class="error-msg">${err.message}</div>`;
      } finally {
        submitBtn.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
