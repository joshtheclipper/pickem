<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick'em Challenge</title>
<meta name="theme-color" content="#12171c">
<!-- theme.js sets data-theme on <html> before first paint; the inline style
     then paints the right background immediately, before style.css (which
     chains to a remote Google Fonts @import) finishes loading — otherwise
     every navigation between pages flashes white while that chain resolves. -->
<script src="/js/theme.js"></script>
<style>html{background:#0a0d10}html[data-theme=light]{background:#eef1f4}</style>
<link rel="stylesheet" href="/css/style.css">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
<link rel="manifest" href="/icons/site.webmanifest">
<link rel="shortcut icon" href="/icons/favicon.ico">
</head>
<body>
  <div class="scorebar">
    <a class="brand" href="/index.html">PICK<span>'</span>EM</a>
    <nav>
      <a href="#" id="tabPicks" class="active">Picks</a>
      <a href="#" id="tabBoard">Board</a>
      <a href="/account.html" id="tabAccount">Account</a>
      <a href="/admin.html" id="tabAdmin" style="display:none">Admin</a>
    </nav>
  </div>

  <div class="wrap">

    <!-- PICKS VIEW -->
    <div id="picksView">
      <div class="tabbar">
        <div class="seg">
          <button class="league-tab active" data-league="NFL">NFL</button>
          <button class="league-tab" data-league="NCAAF">NCAAF</button>
        </div>
        <div class="week-nav">
          <button id="weekDown" aria-label="Previous week">‹</button>
          <span id="weekLabel">Week 1</span>
          <button id="weekUp" aria-label="Next week">›</button>
        </div>
      </div>
      <div id="picksMsg"></div>
      <div id="propsList"></div>
      <div id="gamesList"></div>
    </div>

    <!-- LEADERBOARD VIEW -->
    <div id="boardView" style="display:none">
      <div class="tabbar">
        <div class="seg full">
          <button class="league-tab active" data-scope="overall">Overall</button>
          <button class="league-tab" data-scope="NFL">NFL</button>
          <button class="league-tab" data-scope="NCAAF">NCAAF</button>
        </div>
      </div>
      <div id="boardList"></div>
    </div>

  </div>

  <!-- iOS "Add to Home Screen" install banner. Hidden by default; shown via
       JS only for iPhone/iPad Safari visitors who haven't installed the app
       and haven't dismissed the banner recently (see installPrompt.js). -->
  <div id="ios-install-banner" class="ios-install-banner" style="display:none">
    <button id="iosInstallClose" class="ios-install-close" aria-label="Dismiss">&times;</button>
    <p class="ios-install-text">
      Install Pick'em on your iPhone: tap the <strong>Share</strong> icon
      <span class="ios-share-icon" aria-hidden="true">&#8593;</span>
      below, then choose <strong>Add to Home Screen</strong>.
    </p>
    <div class="ios-install-arrow"></div>
  </div>

  <!-- Floating "lock in picks" bar: appears whenever the player has made a
       pick that isn't locked in yet on the currently-viewed week. Locking
       in is what unlocks pick-to-see for that game. Hidden by default. -->
  <div id="lockPicksBar" class="floating-save-bar" style="display:none">
    <div class="lock-copy">
      <div class="lock-title" id="lockPicksTitle">Picks not locked in</div>
      <div class="lock-sub">Lock in to see everyone’s picks</div>
    </div>
    <button class="btn" id="lockPicksBtn">Lock in</button>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/installPrompt.js"></script>
  <script>
    let league = 'NFL';
    let year = currentSeasonYear();
    // Each league gets its own remembered week, so switching NFL<->NCAAF
    // doesn't drag the other league's week number along. Seeded with the
    // date-based estimate, then overwritten per league by the server's
    // schedule-derived current week in resolveCurrentWeeks().
    // The week arrows mutate `week` only, not this map — the league-switch
    // handler captures the live `week` into the map right before switching,
    // so the map only needs to be right at that moment.
    const weekByLeague = { NFL: estimateCurrentWeek(), NCAAF: estimateCurrentWeek() };
    let week = weekByLeague[league];
    let boardScope = 'overall';
    let me = null; // the signed-in player, for highlighting their leaderboard row
    let currentGames = []; // last-loaded games for the visible league/week, used to drive the lock-in bar
    let currentProps = []; // last-loaded props for the visible league/week, used to drive the lock-in bar
    // "View matchup" panels. The 30s live poll rebuilds every card, so which
    // panels are open (and what they showed) lives out here, keyed by game
    // id, and renderGame puts an open panel straight back without a refetch.
    const openMatchups = new Set();
    const matchupCache = new Map(); // game id -> { at, data }
    const MATCHUP_CACHE_MS = 10 * 60 * 1000;
    // For fitTeamNames(): smallest a team name shrinks to (~70% of the
    // normal 1.45rem), and a reusable Range for measuring name text.
    const TEAM_NAME_MIN_PX = 16;
    const nameRange = document.createRange();

    const gamesList = document.getElementById('gamesList');
    const weekLabel = document.getElementById('weekLabel');
    const picksMsg = document.getElementById('picksMsg');

    async function init() {
      const user = await requireLogin();
      if (!user) return;
      me = user;
      if (user.is_admin) document.getElementById('tabAdmin').style.display = '';
      await resolveCurrentWeeks();
      loadGames();
      if (initialTab === 'board') loadBoard();
    }

    // Ask the server which week is "current" for each league based on the
    // actual schedule the admin entered, and default to it. Falls back
    // silently to the date-based estimate already in weekByLeague if the
    // request fails or a league has no games yet.
    async function resolveCurrentWeeks() {
      try {
        const { weeks } = await api.get(`/api/games/current-week?year=${year}`);
        if (weeks) {
          if (weeks.NFL) weekByLeague.NFL = weeks.NFL;
          if (weeks.NCAAF) weekByLeague.NCAAF = weeks.NCAAF;
          week = weekByLeague[league];
          weekLabel.textContent = `Week ${week}`;
        }
      } catch (e) {
        /* keep the date-based fallback */
      }
    }

    // Confirms before any in-app navigation away from picks (Leaderboard tab,
    // Account/Admin links, sign out) while picks are still unlocked — the
    // beforeunload warning below only covers actually closing/reloading the
    // page, not these SPA-internal or same-tab link navigations.
    function confirmLeaveIfUnlocked() {
      if (!hasUnlockedPicks()) return true;
      return window.confirm("You have picks that aren't locked in yet. Leave this page anyway?");
    }
    // Other pages (Account, Admin) link back here to land on a specific tab
    // via ?tab=board, since — unlike Picks/Leaderboard within this page —
    // they can't just call show('board') directly. Applied immediately
    // (before init()/any async work) so there's no flash of the Picks view.
    // The query string is then stripped so a later refresh doesn't keep
    // forcing the Leaderboard tab after the player has switched away from it.
    const initialTabParams = new URLSearchParams(window.location.search);
    const initialTab = initialTabParams.get('tab') === 'board' ? 'board' : 'picks';
    if (initialTabParams.has('tab')) {
      history.replaceState(null, '', window.location.pathname);
    }
    show(initialTab);

    document.getElementById('tabAccount').addEventListener('click', (e) => {
      if (!confirmLeaveIfUnlocked()) e.preventDefault();
    });
    document.getElementById('tabAdmin').addEventListener('click', (e) => {
      if (!confirmLeaveIfUnlocked()) e.preventDefault();
    });

    // Tab switching
    document.getElementById('tabPicks').addEventListener('click', (e) => {
      e.preventDefault();
      show('picks');
    });
    document.getElementById('tabBoard').addEventListener('click', (e) => {
      e.preventDefault();
      if (!confirmLeaveIfUnlocked()) return;
      show('board');
      loadBoard();
    });
    function show(which) {
      document.getElementById('picksView').style.display = which === 'picks' ? '' : 'none';
      document.getElementById('boardView').style.display = which === 'board' ? '' : 'none';
      document.getElementById('tabPicks').classList.toggle('active', which === 'picks');
      document.getElementById('tabBoard').classList.toggle('active', which === 'board');
      // The lock-in bar is about the picks on screen, so it only shows there.
      if (which === 'board') document.getElementById('lockPicksBar').style.display = 'none';
      else {
        updateLockBar();
        // Names can't be measured while the view is hidden, so fit them now.
        fitTeamNames(gamesList);
      }
    }

    // League tabs (picks view)
    document.querySelectorAll('#picksView .league-tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#picksView .league-tab').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        weekByLeague[league] = week; // remember where this league was left
        league = btn.dataset.league;
        week = weekByLeague[league]; // and jump to the other league's week
        loadGames();
      });
    });

    document.getElementById('weekUp').addEventListener('click', () => { week++; loadGames(); });
    document.getElementById('weekDown').addEventListener('click', () => { if (week > 1) { week--; loadGames(); } });

    // silent=true is used by the live-score poller below — it refreshes the
    // list in place without flashing the "Loading…" placeholder or wiping
    // the props section.
    async function loadGames(silent = false) {
      weekLabel.textContent = `Week ${week}`;
      if (!silent) {
        gamesList.innerHTML = '<div class="empty">Loading…</div>';
        picksMsg.innerHTML = '';
      }
      // Refresh props on every pass, including the silent 30s poll — otherwise
      // a prop the admin grades mid-session never picks up its correct/incorrect
      // colour until the player reloads or switches week/league.
      loadProps(silent);
      try {
        const { games } = await api.get(`/api/games?league=${league}&week=${week}&year=${year}`);
        currentGames = games;
        updateLockBar();
        if (games.length === 0) {
          gamesList.innerHTML = `<div class="empty">No games selected yet for ${league} Week ${week}.<br>Check back once the admin sets the slate.</div>`;
          return;
        }
        gamesList.innerHTML = `<div class="section-label">Games · ${games.length}</div>`;
        games.forEach((g) => gamesList.appendChild(renderGame(g)));
        fitTeamNames(gamesList);
      } catch (err) {
        if (!silent) gamesList.innerHTML = `<div class="error-msg">${err.message}</div>`;
      }
    }

    // Once a score shows up next to a team name, longer names (WAKE, MICH)
    // can run out of room on a phone and get cut off. Shrink just those
    // names until they fit, down to a floor; every other name keeps the
    // normal size. Measures the text itself, because scrollWidth rounds to
    // whole pixels and misses names a fraction of a pixel too wide.
    function nameOverflows(el) {
      nameRange.selectNodeContents(el);
      return nameRange.getBoundingClientRect().width > el.getBoundingClientRect().width + 0.01;
    }
    function fitTeamNames(scope) {
      scope.querySelectorAll('.team-btn .abbr').forEach((el) => {
        el.style.fontSize = '';
        if (!nameOverflows(el)) return;
        let px = parseFloat(getComputedStyle(el).fontSize);
        px = Math.max(TEAM_NAME_MIN_PX, Math.floor(px * (el.clientWidth / el.scrollWidth) * 10) / 10);
        el.style.fontSize = `${px}px`;
        while (nameOverflows(el) && px > TEAM_NAME_MIN_PX) {
          px = Math.max(TEAM_NAME_MIN_PX, px - 0.5);
          el.style.fontSize = `${px}px`;
        }
      });
    }
    // Re-fit when the width changes (rotating the phone) and once the
    // display font has loaded, since fallback-font measurements are off.
    let fitNamesQueued = false;
    window.addEventListener('resize', () => {
      if (fitNamesQueued) return;
      fitNamesQueued = true;
      requestAnimationFrame(() => { fitNamesQueued = false; fitTeamNames(gamesList); });
    });
    if (document.fonts) document.fonts.ready.then(() => fitTeamNames(gamesList));

    // Poll for live score/quarter updates while the picks tab is visible.
    // Matches the cadence of the server's own ESPN sync, so there's no
    // point checking more often than that.
    function pollGamesIfVisible() {
      if (document.visibilityState !== 'visible') return;
      if (document.getElementById('picksView').style.display === 'none') return;
      loadGames(true);
    }
    setInterval(pollGamesIfVisible, 30000);

    // Background tabs get their timers throttled by the browser, so the
    // 30s interval above can fall behind while the tab is hidden. Catch up
    // immediately when the player switches back instead of waiting for the
    // next tick.
    document.addEventListener('visibilitychange', pollGamesIfVisible);

    // --- Lock in picks ---
    // A pick only becomes visible to other players once it's locked in (or
    // the game/prop itself locks). This floating bar appears whenever the
    // current league/week has a made-but-unlocked pick — on a game or a
    // prop — and lets the player commit all of them at once.
    function hasUnlockedPicks() {
      return (
        currentGames.some((g) => g.my_pick && !g.my_pick_locked && !g.locked) ||
        currentProps.some((p) => p.my_answer && !p.my_answer_locked && !p.locked)
      );
    }

    function updateLockBar() {
      if (document.getElementById('picksView').style.display === 'none') return;
      const n =
        currentGames.filter((g) => g.my_pick && !g.my_pick_locked && !g.locked).length +
        currentProps.filter((p) => p.my_answer && !p.my_answer_locked && !p.locked).length;
      document.getElementById('lockPicksTitle').textContent =
        `${n} pick${n === 1 ? '' : 's'} not locked in`;
      document.getElementById('lockPicksBar').style.display = n > 0 ? 'flex' : 'none';
    }

    // Warn before leaving the page (closing the tab, navigating away,
    // refreshing) while picks are still unlocked, so players don't
    // accidentally forget to commit them.
    window.addEventListener('beforeunload', (e) => {
      if (!hasUnlockedPicks()) return;
      e.preventDefault();
      e.returnValue = '';
    });

    document.getElementById('lockPicksBtn').addEventListener('click', async () => {
      const btn = document.getElementById('lockPicksBtn');
      btn.disabled = true;
      try {
        await Promise.all([
          api.post('/api/picks/lock', { league, week, year }),
          api.post('/api/props/lock', { league, week, year }),
        ]);
        await loadGames(); // refresh so badges/buttons reflect the newly-locked state (this also reloads props)
      } catch (err) {
        picksMsg.innerHTML = `<div class="error-msg">${err.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    });

    const propsList = document.getElementById('propsList');

    // Everything about a prop that changes how renderProp() draws it, in a
    // flat string — used to skip the DOM rebuild on a silent poll when
    // nothing actually changed, so an open "Show picks" panel doesn't snap
    // shut every 30s while the player is reading it.
    function propsSignature(list) {
      return list
        .map((p) => [p.id, p.question, p.status, p.correct_answer, p.locked, p.my_answer, p.my_answer_correct, p.my_answer_locked].join('~'))
        .join('|');
    }

    async function loadProps(silent = false) {
      if (!silent) propsList.innerHTML = '';
      try {
        const { props } = await api.get(`/api/props?league=${league}&week=${week}&year=${year}`);
        if (silent && propsSignature(props) === propsSignature(currentProps)) {
          currentProps = props;
          updateLockBar();
          return;
        }
        currentProps = props;
        updateLockBar();
        // Build off-DOM and swap in one go so the silent refresh doesn't
        // flash an empty gap between clearing and repopulating.
        const frag = document.createDocumentFragment();
        if (props.length) {
          const label = document.createElement('div');
          label.className = 'section-label';
          label.textContent = props.length === 1 ? 'Prop' : `Props · ${props.length}`;
          frag.appendChild(label);
        }
        props.forEach((p) => frag.appendChild(renderProp(p)));
        propsList.innerHTML = '';
        propsList.appendChild(frag);
      } catch (err) {
        // Non-fatal — just skip the props section if something goes wrong.
      }
    }

    function renderProp(p) {
      const div = document.createElement('div');
      div.className = 'prop';
      if (p.status === 'closed') div.classList.add('graded');
      if (p.my_answer_correct === 1) div.classList.add('graded-correct');
      if (p.my_answer_correct === 0) div.classList.add('graded-incorrect');

      const statusText = p.status === 'closed'
        ? `<span class="chip status-final">Graded — ${p.correct_answer.toUpperCase()}</span>`
        : (p.locked
            ? '<span class="chip chip-muted">🔒 Locked</span>'
            : (p.my_answer_locked
                ? '<span class="chip chip-muted prop-pick-locked-badge">🔒 Pick locked</span>'
                : '<span class="chip chip-cyan">Yes / No</span>'));
      const locksText = p.locks_at
        ? `Locks ${new Date(p.locks_at).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' })}`
        : 'Prop';

      const disablePick = p.locked || p.my_answer_locked;

      div.innerHTML = `
        <div class="prop-status"><span>${locksText}</span>${statusText}</div>
        <div class="prop-question">${p.question}</div>
        <div class="prop-choices">
          <button class="prop-btn yes-btn ${p.my_answer === 'yes' ? 'picked' : ''}" ${disablePick ? 'disabled' : ''}>YES</button>
          <button class="prop-btn no-btn ${p.my_answer === 'no' ? 'picked' : ''}" ${disablePick ? 'disabled' : ''}>NO</button>
        </div>
      `;

      const yesBtn = div.querySelector('.yes-btn');
      const noBtn = div.querySelector('.no-btn');

      // Once graded, ring the correct answer in gold — even if the player
      // didn't pick it — so the right call is always legible next to a
      // wrong (red) pick.
      if (p.status === 'closed' && p.correct_answer) {
        (p.correct_answer === 'yes' ? yesBtn : noBtn).classList.add('correct-pick');
      }

      if (!disablePick) {
        yesBtn.addEventListener('click', () => makePropPick(p.id, 'yes', div));
        noBtn.addEventListener('click', () => makePropPick(p.id, 'no', div));
      }

      // Everyone's answers on a prop, same "reveal" pattern as game picks.
      const revealWrap = document.createElement('div');
      revealWrap.className = 'picks-reveal-wrap';
      revealWrap.innerHTML = `
        <div class="picks-reveal-footer">
          <button class="reveal-btn">Show picks ▾</button>
        </div>
        <div class="picks-reveal" style="display:none"></div>
      `;
      div.appendChild(revealWrap);

      const revealBtn = revealWrap.querySelector('.reveal-btn');
      const revealPanel = revealWrap.querySelector('.picks-reveal');
      let loaded = false;

      revealBtn.addEventListener('click', async () => {
        const isOpen = revealPanel.style.display !== 'none';
        if (isOpen) {
          revealPanel.style.display = 'none';
          revealBtn.textContent = 'Show picks ▾';
          return;
        }
        revealBtn.textContent = 'Hide picks ▴';
        revealPanel.style.display = '';
        if (loaded) return;
        revealPanel.innerHTML = '<div class="empty" style="padding:10px">Loading…</div>';
        try {
          const { picks } = await api.get(`/api/props/${p.id}/picks`);
          loaded = true;
          if (picks.length === 0) {
            revealPanel.innerHTML = '<div class="empty" style="padding:10px">No one has answered this prop yet.</div>';
            return;
          }
          revealPanel.innerHTML = '';
          picks.forEach((row) => {
            const rowEl = document.createElement('div');
            rowEl.className = 'pick-row';
            if (row.is_correct === 1) rowEl.classList.add('pick-correct');
            if (row.is_correct === 0) rowEl.classList.add('pick-incorrect');
            rowEl.innerHTML = `<span class="pick-row-who">${avatarHtml(row, 26)}<span>${escapeHtml(row.username)}</span></span><span class="pick-row-team">${row.answer.toUpperCase()}</span>`;
            revealPanel.appendChild(rowEl);
          });
        } catch (err) {
          if (err.status === 403) {
            // Pick-to-see: they haven't locked in their own answer on this
            // prop yet, so this isn't really an error — just a prompt.
            revealPanel.innerHTML = `<div class="empty" style="padding:10px">${err.message}</div>`;
          } else {
            revealPanel.innerHTML = `<div class="error-msg">${err.message}</div>`;
          }
        }
      });

      return div;
    }

    async function makePropPick(propId, answer, rowEl) {
      const yesBtn = rowEl.querySelector('.yes-btn');
      const noBtn = rowEl.querySelector('.no-btn');
      const prevYes = yesBtn.classList.contains('picked');
      const prevNo = noBtn.classList.contains('picked');

      // Tapping the answer that's already selected clears it.
      const deselect = (answer === 'yes' && prevYes) || (answer === 'no' && prevNo);

      yesBtn.classList.toggle('picked', !deselect && answer === 'yes');
      noBtn.classList.toggle('picked', !deselect && answer === 'no');
      picksMsg.innerHTML = '';

      try {
        if (deselect) {
          await api.del('/api/props/pick', { prop_id: propId });
        } else {
          await api.post('/api/props/pick', { prop_id: propId, answer });
        }
        const cached = currentProps.find((p) => p.id === propId);
        if (cached) {
          cached.my_answer = deselect ? null : answer;
          cached.my_answer_locked = false;
          updateLockBar();
        }
      } catch (err) {
        yesBtn.classList.toggle('picked', prevYes);
        noBtn.classList.toggle('picked', prevNo);
        picksMsg.innerHTML = `<div class="error-msg">${err.message}</div>`;
      }
    }

    function renderGame(g) {
      const div = document.createElement('div');
      div.className = 'game';
      if (g.my_pick_correct === 1) div.classList.add('graded-correct');
      if (g.my_pick_correct === 0) div.classList.add('graded-incorrect');
      if (g.status === 'final') div.classList.add('game-final');
      if (g.status === 'in_progress') div.classList.add('game-live');

      const kickoff = new Date(g.start_time);
      const timeStr = kickoff.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

      const statusText = g.status === 'final'
        ? `<span class="status-final">Final</span>`
        : g.status === 'in_progress'
          ? `<span class="lock live">${g.status_detail || 'In progress'}</span>`
          : (g.locked
              ? `<span class="lock">🔒 Locked</span>`
              : (g.my_pick_locked
                  ? `<span class="lock pick-locked-badge">🔒 Pick locked</span>`
                  : `<span class="lock lock-open">Pick open</span>`));

      const adminEditedBadge = g.my_pick_admin_overridden
        ? '<span class="admin-edited-badge" title="An admin set or corrected this pick">Admin-edited</span>'
        : '';

      // ESPN reports 0-0 before kickoff; only show a score once there is one.
      const showScores = g.status !== 'scheduled';

      div.innerHTML = `
        <div class="game-meta">
          <span>${timeStr}</span>
          <span>${statusText}</span>
        </div>
        <div class="matchup">
          <button class="team-btn away-btn ${g.my_pick === 'away' ? 'picked' : ''}" ${(g.locked || g.my_pick_locked) ? 'disabled' : ''}>
            ${g.away_team_logo ? `<img src="${g.away_team_logo}" alt="">` : ''}
            <span class="team-name">${g.away_rank ? `<span class="rank-badge">#${g.away_rank}</span>` : ''}<span class="abbr">${g.away_team_abbr || g.away_team}</span></span>
            ${showScores && g.away_score !== null ? `<span class="score">${g.away_score}</span>` : ''}
          </button>
          <span class="at-sign">@</span>
          <button class="team-btn right-side home-btn ${g.my_pick === 'home' ? 'picked' : ''}" ${(g.locked || g.my_pick_locked) ? 'disabled' : ''}>
            ${g.home_team_logo ? `<img src="${g.home_team_logo}" alt="">` : ''}
            <span class="team-name">${g.home_rank ? `<span class="rank-badge">#${g.home_rank}</span>` : ''}<span class="abbr">${g.home_team_abbr || g.home_team}</span></span>
            ${showScores && g.home_score !== null ? `<span class="score">${g.home_score}</span>` : ''}
          </button>
        </div>
      `;

      div.dataset.gameId = g.id;

      // Once the game is final, ring the winning team in gold — even if the
      // player didn't pick it — so the correct pick stands out next to a
      // wrong (red) one. Ties have no correct side.
      if (g.status === 'final' && (g.winner === 'home' || g.winner === 'away')) {
        div.querySelector(g.winner === 'home' ? '.home-btn' : '.away-btn').classList.add('correct-pick');
      }

      // Everyone's picks are visible on any game at any time — not just
      // after it locks. The pick buttons themselves stay disabled once
      // locked (handled below), but the reveal panel is always available.
      const revealWrap = document.createElement('div');
      revealWrap.className = 'picks-reveal-wrap';
      revealWrap.innerHTML = `
        <div class="picks-reveal-footer">
          <div class="picks-reveal-footer-left">
            <button class="reveal-btn">Show picks ▾</button>
            ${adminEditedBadge}
          </div>
          <button class="reveal-btn matchup-btn" aria-expanded="false">View matchup ▾</button>
        </div>
        <div class="picks-reveal" style="display:none"></div>
        <div class="matchup-panel" style="display:none"></div>
      `;
      div.appendChild(revealWrap);

      const matchupBtn = revealWrap.querySelector('.matchup-btn');
      const matchupPanel = revealWrap.querySelector('.matchup-panel');
      const setMatchupOpen = (open) => {
        matchupPanel.style.display = open ? '' : 'none';
        matchupBtn.textContent = open ? 'Hide matchup ▴' : 'View matchup ▾';
        matchupBtn.setAttribute('aria-expanded', String(open));
        if (open) openMatchups.add(g.id); else openMatchups.delete(g.id);
      };
      const fillMatchup = async () => {
        const hit = matchupCache.get(g.id);
        if (hit && Date.now() - hit.at < MATCHUP_CACHE_MS) {
          matchupPanel.innerHTML = matchupHtml(g, hit.data);
          return;
        }
        if (!hit) matchupPanel.innerHTML = '<div class="empty" style="padding:10px">Loading…</div>';
        try {
          const data = await api.get(`/api/games/${g.id}/matchup`);
          matchupCache.set(g.id, { at: Date.now(), data });
          matchupPanel.innerHTML = matchupHtml(g, data);
        } catch (err) {
          // A stale copy beats an error; only show the error with nothing to fall back on.
          if (!hit) matchupPanel.innerHTML = `<div class="error-msg">${escapeHtml(err.message)}</div>`;
        }
      };
      matchupBtn.addEventListener('click', () => {
        const open = matchupPanel.style.display === 'none';
        setMatchupOpen(open);
        if (open) fillMatchup();
      });
      if (openMatchups.has(g.id)) {
        setMatchupOpen(true);
        fillMatchup();
      }

      const revealBtn = revealWrap.querySelector('.reveal-btn');
      const revealPanel = revealWrap.querySelector('.picks-reveal');
      let loaded = false;

      revealBtn.addEventListener('click', async () => {
        const isOpen = revealPanel.style.display !== 'none';
        if (isOpen) {
          revealPanel.style.display = 'none';
          revealBtn.textContent = 'Show picks ▾';
          return;
        }
        revealBtn.textContent = 'Hide picks ▴';
        revealPanel.style.display = '';
        if (loaded) return;
        revealPanel.innerHTML = '<div class="empty" style="padding:10px">Loading…</div>';
        try {
          const { picks } = await api.get(`/api/games/${g.id}/picks`);
          loaded = true;
          if (picks.length === 0) {
            revealPanel.innerHTML = '<div class="empty" style="padding:10px">No one has picked this game yet.</div>';
            return;
          }
          revealPanel.innerHTML = '';
          picks.forEach((p) => {
            const row = document.createElement('div');
            row.className = 'pick-row';
            if (p.is_correct === 1) row.classList.add('pick-correct');
            if (p.is_correct === 0) row.classList.add('pick-incorrect');
            const teamLabel = p.pick === 'home' ? (g.home_team_abbr || g.home_team) : (g.away_team_abbr || g.away_team);
            const adminMark = p.admin_overridden
              ? '<span class="admin-edited-badge admin-edited-badge-inline">Admin-edited</span> '
              : '';
            row.innerHTML = `<span class="pick-row-who">${avatarHtml(p, 26)}<span>${escapeHtml(p.username)}</span></span><span class="pick-row-team">${adminMark}${teamLabel}</span>`;
            revealPanel.appendChild(row);
          });
        } catch (err) {
          if (err.status === 403) {
            // Pick-to-see: they haven't locked in their own pick on this
            // game yet, so this isn't really an error — just a prompt.
            revealPanel.innerHTML = `<div class="empty" style="padding:10px">${err.message}</div>`;
          } else {
            revealPanel.innerHTML = `<div class="error-msg">${err.message}</div>`;
          }
        }
      });

      const awayBtn = div.querySelector('.away-btn');
      const homeBtn = div.querySelector('.home-btn');
      if (!g.locked && !g.my_pick_locked) {
        awayBtn.addEventListener('click', () => makePick(g.id, 'away', div));
        homeBtn.addEventListener('click', () => makePick(g.id, 'home', div));
      }
      return div;
    }

    // "BUF -7 · O/U 50.5" -> { away: '+7', home: '-7' }. ESPN only names the
    // favorite, so the underdog's number is the same line flipped. null when
    // there's no line yet (or it names neither team).
    function spreadsFor(g) {
      const line = (g.odds_summary || '').split(' · ').find((part) => part && !part.startsWith('O/U'));
      if (!line) return null;
      if (/^(EVEN|PK|PICK)/i.test(line)) return { away: 'PK', home: 'PK' };
      const m = line.match(/^(\S+)\s+([+-]?\d+(?:\.\d+)?)$/);
      if (!m) return null;
      const n = Number(m[2]);
      if (n === 0) return { away: 'PK', home: 'PK' };
      const fmt = (x) => (x > 0 ? `+${x}` : String(x));
      if (m[1] === g.home_team_abbr) return { home: fmt(n), away: fmt(-n) };
      if (m[1] === g.away_team_abbr) return { away: fmt(n), home: fmt(-n) };
      return null;
    }

    // Side-by-side team columns for the "View matchup" panel: away on the
    // left, home on the right, same order as the pick buttons above.
    function matchupHtml(g, data) {
      const spreads = spreadsFor(g);
      const col = (side, t) => {
        const abbr = side === 'home' ? (g.home_team_abbr || g.home_team) : (g.away_team_abbr || g.away_team);
        const logo = side === 'home' ? g.home_team_logo : g.away_team_logo;
        const spread = spreads && spreads[side];
        const spreadChip = spread
          ? `<span class="spread-chip${spread.startsWith('-') ? ' fav' : ''}" title="Point spread">${spread}</span>`
          : '';
        const rows = t.games.length
          ? `<ul class="mu-games">${t.games.map((x) => `
              <li>
                <span class="mu-res mu-res-${x.result}">${x.result}</span>
                <span class="mu-score">${x.team_score}-${x.opp_score}</span>
                <span class="mu-opp">${x.home_away === 'away' ? '@' : 'vs'} ${x.opponent_rank ? `<span class="rank-badge">#${x.opponent_rank}</span> ` : ''}${escapeHtml(x.opponent_abbr)}${x.opponent_logo ? `<img src="${escapeHtml(x.opponent_logo)}" alt="" loading="lazy">` : ''}</span>
              </li>`).join('')}</ul>`
          : '<div class="mu-none">No games played yet</div>';
        return `
          <div class="mu-col">
            <div class="mu-head">
              ${logo ? `<img src="${logo}" alt="">` : ''}
              <span class="mu-abbr">${escapeHtml(abbr)}</span>
              <span class="mu-side">${side === 'home' ? 'Home' : 'Away'}</span>
            </div>
            <div>
              <div class="mu-rec-row"><span class="mu-rec">${t.record}</span>${spreadChip}</div>
              ${t.standing ? `<div class="mu-standing">${escapeHtml(t.standing)}</div>` : ''}
            </div>
            ${rows}
          </div>`;
      };
      return `<div class="mu-cols">${col('away', data.away)}${col('home', data.home)}</div>`;
    }

    // Optimistically updates just the one game row instead of reloading the
    // whole list, so picking doesn't cause a visible full-screen refresh.
    async function makePick(gameId, pick, rowEl) {
      const awayBtn = rowEl.querySelector('.away-btn');
      const homeBtn = rowEl.querySelector('.home-btn');
      const prevAway = awayBtn.classList.contains('picked');
      const prevHome = homeBtn.classList.contains('picked');

      // Tapping the side that's already selected clears the pick, so a
      // misclick doesn't force you to leave one team or the other picked.
      const deselect = (pick === 'away' && prevAway) || (pick === 'home' && prevHome);

      awayBtn.classList.toggle('picked', !deselect && pick === 'away');
      homeBtn.classList.toggle('picked', !deselect && pick === 'home');
      picksMsg.innerHTML = '';

      try {
        if (deselect) {
          await api.del('/api/picks', { game_id: gameId });
        } else {
          await api.post('/api/picks', { game_id: gameId, pick });
        }
        const cached = currentGames.find((g) => g.id === gameId);
        if (cached) {
          cached.my_pick = deselect ? null : pick;
          cached.my_pick_locked = false;
          updateLockBar();
        }
      } catch (err) {
        // revert the optimistic change on failure
        awayBtn.classList.toggle('picked', prevAway);
        homeBtn.classList.toggle('picked', prevHome);
        picksMsg.innerHTML = `<div class="error-msg">${err.message}</div>`;
      }
    }

    // Leaderboard
    document.querySelectorAll('#boardView .league-tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#boardView .league-tab').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        boardScope = btn.dataset.scope;
        loadBoard();
      });
    });

    const ICON_CROWN = (size) =>
      `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>`;
    const ICON_FLAME =
      '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 2 1.5 3 2.5 3-1-3 0-6 0-9z"/></svg>';
    const ICON_SNOW =
      '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M3.5 7l17 10M20.5 7l-17 10M9.5 3.5L12 6l2.5-2.5M9.5 20.5L12 18l2.5 2.5"/></svg>';

    // Hot = 3+ right in a row (red flame), cold = 3+ wrong in a row (snowflake).
    function streakHtml(st) {
      if (!st) return '';
      const hot = st.type === 'hot';
      const label = `${st.count} ${hot ? 'right' : 'wrong'} in a row`;
      return `<span class="streak ${st.type}" title="${label}" aria-label="${label}">${hot ? ICON_FLAME : ICON_SNOW}${st.count}</span>`;
    }

    // Places gained/lost since before the latest graded week.
    function moveHtml(m) {
      if (m == null) return '<span class="move same"></span>';
      if (m > 0) return `<span class="move up" title="Up ${m} since last week">▲${m}</span>`;
      if (m < 0) return `<span class="move down" title="Down ${-m} since last week">▼${-m}</span>`;
      return '<span class="move same" title="No change since last week">—</span>';
    }

    function winnerCardHtml(w) {
      if (!w) return '';
      const names = w.winners.map((u) => escapeHtml(u.username)).join(' & ');
      const faces = w.winners.slice(0, 3).map((u) => avatarHtml(u, 44)).join('');
      return `
        <div class="winner-card">
          <div class="winner-stack">${faces}</div>
          <div style="min-width:0;flex:1">
            <div class="winner-label">${ICON_CROWN(14)}${w.league} Week ${w.week} winner${w.winners.length > 1 ? 's' : ''}</div>
            <div class="winner-name">${names}</div>
          </div>
          <div class="winner-score num">${w.correct}/${w.graded}</div>
        </div>`;
    }

    function podiumSpotHtml(row, place) {
      const first = place === 1;
      const blockH = { 1: 140, 2: 104, 3: 84 }[place];
      const numSize = { 1: 58, 2: 44, 3: 38 }[place];
      const isYou = me && row.user_id === me.id;
      return `
        <div class="podium-spot${first ? ' first' : ''}">
          ${first ? `<div class="podium-crown">${ICON_CROWN(22)}</div>` : ''}
          ${avatarHtml(row, first ? 60 : 48)}
          <div class="podium-name">${escapeHtml(row.username)}${isYou ? ' <span class="you-tag" style="font-size:0.62rem;color:var(--accent-text)">YOU</span>' : ''}</div>
          <div class="podium-tags">${moveHtml(row.movement)}${streakHtml(row.streak)}</div>
          <div class="podium-block" style="height:${blockH}px">
            <div class="num" style="font-size:${numSize}px">${place}</div>
            <small>${row.correct_picks} correct</small>
          </div>
        </div>`;
    }

    function boardRowHtml(row, rank) {
      const isYou = me && row.user_id === me.id;
      const pct = row.graded_picks ? Math.round((row.correct_picks * 100) / row.graded_picks) : 0;
      return `
        <div class="board-row${isYou ? ' is-you' : ''}">
          <div class="rank">${rank}</div>
          ${moveHtml(row.movement)}
          ${avatarHtml(row, 36)}
          <div style="min-width:0">
            <div class="name"><span class="who">${escapeHtml(row.username)}</span>${isYou ? '<span class="you-tag">YOU</span>' : ''}${streakHtml(row.streak)}</div>
            <div class="sub">${row.correct_picks}/${row.graded_picks} · ${pct}%</div>
            <div class="acc-bar"><div style="width:${pct}%"></div></div>
          </div>
          <div class="pts">${row.correct_picks}</div>
        </div>`;
    }

    async function loadBoard() {
      const boardList = document.getElementById('boardList');
      boardList.innerHTML = '<div class="empty" style="margin-top:14px">Loading…</div>';
      const qs = boardScope === 'overall' ? '' : `?league=${boardScope}`;
      try {
        const { leaderboard, weekly_winner } = await api.get(`/api/leaderboard${qs}`);
        if (leaderboard.length === 0) {
          boardList.innerHTML = '<div class="empty" style="margin-top:14px">No players yet.</div>';
          return;
        }
        // A podium only makes sense once there are three players and
        // something has actually been graded.
        const anyGraded = leaderboard.some((r) => r.graded_picks > 0);
        const podium = anyGraded && leaderboard.length >= 3;
        let html = winnerCardHtml(weekly_winner);
        if (podium) {
          html += `<div class="podium">${podiumSpotHtml(leaderboard[1], 2)}${podiumSpotHtml(leaderboard[0], 1)}${podiumSpotHtml(leaderboard[2], 3)}</div>`;
        }
        const rest = podium ? leaderboard.slice(3) : leaderboard;
        if (rest.length) {
          html += `<div class="board-list">${rest.map((r, i) => boardRowHtml(r, i + 1 + (podium ? 3 : 0))).join('')}</div>`;
        }
        boardList.innerHTML = html;
      } catch (err) {
        boardList.innerHTML = `<div class="error-msg" style="margin-top:14px">${escapeHtml(err.message)}</div>`;
      }
    }

    init();
  </script>
</body>
</html>
